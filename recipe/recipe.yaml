context:
  name: airflow-common
  version: "0.7.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/airflow-common/airflow_common-${{ version }}.tar.gz
  sha256: 9531156b532254a0316393c1c21f9891d999fe4ea6c9956cd4b662c1ae4472af

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - airflow-pydantic >=1.6,<1.8
    - pydantic >=2

tests:
  - python:
      imports:
        - airflow_common
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Common Airflow Operators / Tasks
  homepage: https://github.com/airflow-laminar/airflow-common
  repository: https://github.com/airflow-laminar/airflow-common

extra:
  recipe-maintainers:
    - timkpaine
